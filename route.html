<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#4f46e5">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; padding-bottom: 80px; }
    .nav-btn { display: flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 14px; border-radius: 20px; color: #94a3b8; }
    .nav-btn .nav-text { display: none; font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; }
    .nav-btn.nav-active { background-color: #eef2ff; color: #4f46e5; padding: 9px 20px; }
    .nav-btn.nav-active .nav-text { display: block; }
    @media (min-width: 768px) {
      body { background-color: #f1f5f9 !important; }
      nav.fixed { max-width: 480px; left: 50% !important; transform: translateX(-50%); }
    }
  </style>
</head>

<body class="bg-slate-50">

  <!-- HEADER -->
  <div class="sticky top-0 z-50 w-full flex flex-col items-center">
    <div class="w-full max-w-md mx-auto bg-gradient-to-br from-indigo-600 to-violet-700 rounded-b-3xl shadow-md px-4 py-4 flex justify-between items-center text-white">
      <div>
        <h1 class="font-black text-lg uppercase tracking-wide">Route Itinerary</h1>
        <p class="text-[9px] font-bold text-indigo-200 uppercase tracking-widest">Live Schedule & GPS</p>
      </div>
      <a href="/" class="p-2 bg-white/10 rounded-full"><i data-lucide="arrow-left" class="w-5 h-5"></i></a>
    </div>
  </div>

  <!-- ROUTE TIMELINE CONTAINER -->
  <main class="max-w-md mx-auto p-4 space-y-4">
    <div id="ui-timeline-container" class="space-y-4"></div>
  </main>

  <!-- MULTI-PAGE BOTTOM NAVIGATION BAR (ROUTE ACTIVE) -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white/80 backdrop-blur-md px-4 py-2.5 flex justify-between items-center z-50 shadow-md">
    <a href="/index.html" class="nav-btn group outline-none">
      <i data-lucide="wallet" class="w-5 h-5"></i>
      <span class="nav-text">Spend</span>
    </a>
    <a href="/squad.html" class="nav-btn group outline-none">
      <i data-lucide="users" class="w-5 h-5"></i>
      <span class="nav-text">Squad</span>
    </a>
    <a href="/route.html" class="nav-btn nav-active group outline-none">
      <i data-lucide="map-pin" class="w-5 h-5"></i>
      <span class="nav-text">Route</span>
    </a>
    <a href="/admin.html" class="p-2.5 text-indigo-600"><i data-lucide="shield" class="w-5 h-5"></i></a>
  </nav>

  <script>
    async function fetchRoute() {
      const res = await fetch('/api/index?action=dashboard');
      const data = await res.json();
      renderRoute(data.places);
    }

    function renderRoute(places) {
      const container = document.getElementById('ui-timeline-container');
      const valid = places.filter(p => p.tripDay || p.location);
      
      container.innerHTML = valid.map(p => `
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-start gap-3">
          <div class="w-2.5 h-2.5 rounded-full bg-indigo-500 mt-1.5 shrink-0"></div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2">
              <span class="bg-indigo-50 text-indigo-600 font-black text-[9px] px-2 py-0.5 rounded">${p.tripDay || 'Day 1'}</span>
              <p class="text-xs font-black text-slate-800 truncate">${p.location || p.name}</p>
            </div>
            <p class="text-[10px] text-slate-400 font-bold mt-1">ETA: ${p.eta || '-'} | ATA: ${p.ata || '-'}</p>
            ${p.details ? `<p class="text-[10px] text-slate-500 mt-1">${p.details}</p>` : ''}
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    window.onload = () => { lucide.createIcons(); fetchRoute(); };
  </script>
</body>
</html>
