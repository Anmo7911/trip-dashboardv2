<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#4f46e5">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; padding-bottom: 80px; }
    .nav-btn { display: flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 14px; border-radius: 20px; color: #94a3b8; }
    .nav-btn .nav-text { display: none; font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; }
    .nav-btn.nav-active { background-color: #eef2ff; color: #4f46e5; padding: 9px 20px; }
    .nav-btn.nav-active .nav-text { display: block; }
    @media (min-width: 768px) {
      body { background-color: #f1f5f9 !important; }
      nav.fixed, .header-container { max-width: 480px; left: 50% !important; transform: translateX(-50%); }
    }
  </style>
</head>

<body class="bg-slate-50">

  <!-- HEADER -->
  <div class="sticky top-0 z-50 w-full flex flex-col items-center">
    <div class="w-full max-w-md mx-auto bg-gradient-to-br from-indigo-600 to-violet-700 rounded-b-3xl shadow-md px-4 py-4 flex justify-between items-center text-white">
      <div>
        <h1 class="font-black text-lg uppercase tracking-wide">Trip Squad</h1>
        <p class="text-[9px] font-bold text-indigo-200 uppercase tracking-widest">Members & Coordinators</p>
      </div>
      <a href="/" class="p-2 bg-white/10 rounded-full"><i data-lucide="arrow-left" class="w-5 h-5"></i></a>
    </div>
  </div>

  <!-- SQUAD CONTAINER -->
  <main class="max-w-md mx-auto p-4 space-y-4">
    <div id="leaderSection" class="space-y-3"></div>
    <div class="space-y-3">
      <h3 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest px-1">Trip Members</h3>
      <div id="memberList" class="grid grid-cols-2 gap-3"></div>
    </div>
  </main>

  <!-- ROLE MODAL -->
  <div id="role-details-modal" class="hidden fixed inset-0 z-[10000] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4" onclick="closeRoleDetailsModal()">
    <div class="w-full max-w-sm bg-white rounded-3xl p-6 text-center border shadow-2xl" onclick="event.stopPropagation()">
      <h2 id="modal-role-member-name" class="text-sm font-black text-slate-400 uppercase tracking-widest mb-1"></h2>
      <h3 class="text-xl font-black text-slate-800 uppercase tracking-wide mb-4">Assigned Tasks</h3>
      <div id="modal-role-content" class="w-full text-xs font-bold text-slate-600 pb-4 text-left"></div>
      <button onclick="closeRoleDetailsModal()" class="w-full bg-slate-900 text-white font-black py-3 rounded-xl uppercase text-xs">Close</button>
    </div>
  </div>

  <!-- MULTI-PAGE BOTTOM NAVIGATION BAR (SQUAD ACTIVE) -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white/80 backdrop-blur-md px-4 py-2.5 flex justify-between items-center z-50 shadow-md">
    <a href="/index.html" class="nav-btn group outline-none">
      <i data-lucide="wallet" class="w-5 h-5"></i>
      <span class="nav-text">Spend</span>
    </a>
    <a href="/squad.html" class="nav-btn nav-active group outline-none">
      <i data-lucide="users" class="w-5 h-5"></i>
      <span class="nav-text">Squad</span>
    </a>
    <a href="/route.html" class="nav-btn group outline-none">
      <i data-lucide="map-pin" class="w-5 h-5"></i>
      <span class="nav-text">Route</span>
    </a>
    <a href="/admin.html" class="p-2.5 text-indigo-600"><i data-lucide="shield" class="w-5 h-5"></i></a>
  </nav>

  <script>
    async function fetchSquad() {
      const res = await fetch('/api/index?action=dashboard');
      const data = await res.json();
      renderSquad(data);
    }

    function renderSquad(data) {
      const coordinator = data.members.find(m => m.role && m.role.toLowerCase().includes('coordinator'));
      const others = data.members.filter(m => !m.role || !m.role.toLowerCase().includes('coordinator'));

      if (coordinator) {
        document.getElementById('leaderSection').innerHTML = `
          <div onclick='openRoleModal(${JSON.stringify(coordinator)})' class="bg-gradient-to-br from-indigo-600 to-violet-700 text-white p-5 rounded-2xl shadow-md flex items-center justify-between cursor-pointer">
            <div class="flex items-center gap-3">
              <img src="${coordinator.img || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(coordinator.name)}" class="w-14 h-14 rounded-full object-cover border-2 border-white/40">
              <div>
                <p class="text-lg font-black">${coordinator.name}</p>
                <p class="text-xs text-indigo-200 font-bold uppercase">${coordinator.role}</p>
              </div>
            </div>
            <i data-lucide="chevron-right" class="w-5 h-5 text-indigo-200"></i>
          </div>`;
      }

      document.getElementById('memberList').innerHTML = others.map(m => `
        <div onclick='openRoleModal(${JSON.stringify(m)})' class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col items-center text-center cursor-pointer hover:border-indigo-300">
          <img src="${m.img || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(m.name)}" class="w-16 h-16 rounded-full object-cover border-2 border-slate-100 mb-2">
          <p class="font-black text-xs text-slate-800 truncate w-full">${m.name}</p>
          <p class="text-[9px] font-bold text-indigo-500 uppercase mt-0.5">${m.role || 'Member'}</p>
        </div>
      `).join('');
      lucide.createIcons();
    }

    function openRoleModal(member) {
      document.getElementById('modal-role-member-name').innerText = member.name;
      document.getElementById('modal-role-content').innerText = member.assignedRoleDetail || "No specific tasks assigned.";
      document.getElementById('role-details-modal').classList.remove('hidden');
    }
    function closeRoleDetailsModal() { document.getElementById('role-details-modal').classList.add('hidden'); }

    window.onload = () => { lucide.createIcons(); fetchSquad(); };
  </script>
</body>
</html>
